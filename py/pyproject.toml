[project]
name = "scenecast-py"
version = "0.0.0"
description = "Python helpers for scenecast (TTS, alignment, audio, frames)"
requires-python = ">=3.10,<3.14"
dependencies = [
  "kokoro-onnx",
  "faster-whisper",
  "soundfile",
  "numpy",
  "imageio-ffmpeg",
  "pillow",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scenecast_py"]
