# Renders the demo video end to end on Linux and uploads its audit.
# The render is slow (several minutes), so it runs on demand and on pushes to main.
name: e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  demo-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The e2e test writes out/ and work/ here, so the audit lands in out/audit.
      SCENECAST_E2E: '1'
      SCENECAST_E2E_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # uv, the Python environment, the Kokoro and Whisper models and NLTK data all live under ~/.cache.
      - name: Cache uv and models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/scenecast
            ~/.cache/uv
            ~/.local/bin/uv
            ~/.local/bin/uvx
          key: scenecast-${{ runner.os }}-${{ hashFiles('py/uv.lock', 'packages/core/src/toolchain.ts') }}
          restore-keys: scenecast-${{ runner.os }}-

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and its system libraries
        run: pnpm -C packages/cli exec playwright install --with-deps chromium

      - name: scenecast doctor
        run: node packages/cli/bin/scenecast.js doctor

      - name: Render the demo and audit it
        run: pnpm -C packages/cli exec vitest run -t e2e

      - name: Upload the audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-audit
          path: out/audit
          if-no-files-found: warn
