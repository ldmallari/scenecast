packages:
  - "packages/*"
# Only these install scripts run: they chmod the ffprobe binary Revideo calls.
# (puppeteer's Chrome download is skipped: the composer uses Playwright's Chromium.)
onlyBuiltDependencies:
  - "@ffprobe-installer/darwin-arm64"
  - "@ffprobe-installer/darwin-x64"
  - "@ffprobe-installer/linux-arm64"
  - "@ffprobe-installer/linux-x64"
# Revideo's @revideo/ffmpeg wants @ffmpeg-installer/ffmpeg, which downloads a prebuilt (GPL, and on macOS arm64
# non-free) ffmpeg. scenecast never runs it, so a local stand-in that points at the toolchain ffmpeg replaces it.
overrides:
  "@ffmpeg-installer/ffmpeg": "link:./stubs/ffmpeg-installer"
